# Interim per golem ADR 0035, same terms as ci.yml: GitHub Actions only until
# the self-hosted golem-managed box exists. Publishing to ghcr.io is itself an
# interim choice, not a resolution of ADR 0035 §5 (the release mechanism is
# still open there) -- see docs/adr/0001-interim-ghcr-container-channel.md.
#
# Only a `v*` tag reaches this file. ci.yml already builds and smoke-tests the
# same image on every push and PR; this workflow exists solely to add the
# publish step once a tag says a version is ready, keeping "check" and
# "release" as separate triggers per ADR 0035's tag-driven release policy.
name: Release

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    # packages: write is what lets GITHUB_TOKEN authenticate the skopeo push
    # below; contents: read is actions/checkout's default requirement.
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v15
        with:
          name: dull-ca
          authToken: ${{ secrets.DULL_CA_CACHIX_PRIVATE_KEY }}

      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run build

      # Same build ci.yml runs; see the comment there for why bun builds the
      # site and nix only packages it. `result` is nix's docker-archive
      # output, the input the two skopeo copies below read from.
      - name: Build container image
        run: DULL_SITE_DIST=$PWD/dist nix build --impure .#container --print-build-logs

      # NOTE: the git tag is the sole source of the version. package.json's
      # version field is never read, and stays at its placeholder value.
      - name: Derive version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      # skopeo reads nix's docker-archive output directly -- no docker daemon,
      # no decompression of the gzipped archive. That keeps the push a single
      # thin step: everything upstream of `docker-archive:result` is unaware
      # ghcr.io exists, so retargeting to a different registry later is a
      # change to these two destination arguments, not a rewrite. Two copies
      # because the version tag and `latest` are independent refs in the
      # registry; skopeo has no "push and also tag" in one call.
      - name: Publish to ghcr.io
        run: |
          nix run nixpkgs#skopeo -- copy \
            --dest-creds "${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}" \
            docker-archive:result \
            docker://ghcr.io/dull-ca/dull.yyc.dev:${VERSION}
          nix run nixpkgs#skopeo -- copy \
            --dest-creds "${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}" \
            docker-archive:result \
            docker://ghcr.io/dull-ca/dull.yyc.dev:latest
