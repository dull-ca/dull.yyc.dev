name: Release

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          # History for `assert-on-main`.
          fetch-depth: 0

      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v15
        with:
          name: dull-ca
          authToken: ${{ secrets.DULL_CA_CACHIX_PRIVATE_KEY }}

      # The same guards `release` runs locally, built from the same pinned
      # dull-nix -- not a second copy of the version pattern or the ancestor
      # check. `flake.lock` is what makes them the same guards; a lock that
      # doesn't evaluate takes this job down with it.
      #
      # skopeo joins them so the guard and the publish steps run the same
      # binary rather than the runner's preinstalled one: one flag surface, one
      # registries.conf dialect (below), nothing turning on the runner image.
      # `^out` picks one path; bare `nixpkgs#skopeo` would also print `man`.
      - name: Put the release guards and skopeo on PATH
        run: |
          guards=$(nix build --no-link --print-out-paths .#release-guards)
          skopeo=$(nix build --no-link --print-out-paths 'nixpkgs#skopeo^out')
          echo "$guards/bin" >> "$GITHUB_PATH"
          echo "$skopeo/bin" >> "$GITHUB_PATH"

      - name: Resolve the version and the commit
        run: |
          release-guards assert-releasable "$GITHUB_REF_NAME"
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          echo "RELEASE_COMMIT=$(git rev-parse "$GITHUB_SHA^{commit}")" >> "$GITHUB_ENV"
          if release-guards is-stable "$GITHUB_REF_NAME"; then
            echo "IS_STABLE_RELEASE=true" >> "$GITHUB_ENV"
          else
            echo "IS_STABLE_RELEASE=false" >> "$GITHUB_ENV"
          fi

      - name: Refuse to release a commit that is not on main
        run: release-guards assert-on-main "$RELEASE_COMMIT"

      # The runner's preinstalled container tooling ships a v1
      # /etc/containers/registries.conf; nixpkgs' skopeo (1.24.0) only reads
      # v2 and aborts while loading that file, before it ever reaches the
      # registry:
      #   fatal: get credentials: loading registries configuration
      #   "/etc/containers/registries.conf": registries.conf must be in v2
      #   format but is in v1
      # -- not a credentials or permissions problem, even though that's what
      # a failing `skopeo login` suggests. Pointing CONTAINERS_REGISTRIES_CONF
      # at this minimal v2 file bypasses the runner's copy entirely (verified
      # both ways: v1 reproduces the error above, v2 reaches real auth). It's
      # exported via $GITHUB_ENV rather than a step `env:` because all four
      # skopeo calls below need it -- this login, the publish guard's inspect,
      # and both copies -- not just the next step.
      - name: Configure container registries.conf
        run: |
          cat > "$RUNNER_TEMP/registries.conf" <<'EOF'
          unqualified-search-registries = ["docker.io"]
          EOF
          echo "CONTAINERS_REGISTRIES_CONF=$RUNNER_TEMP/registries.conf" >> "$GITHUB_ENV"

      # stdin, not --dest-creds "user:$TOKEN": that would put the token in the runner's process table on every copy.
      - name: Authenticate to ghcr.io
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" | skopeo login \
            --username "$GITHUB_ACTOR" \
            --password-stdin \
            --authfile "$RUNNER_TEMP/ghcr-auth.json" \
            ghcr.io
          echo "GHCR_AUTHFILE=$RUNNER_TEMP/ghcr-auth.json" >> "$GITHUB_ENV"

      # Needs ghcr auth (just above) to tell a real 404 from a 401 --
      # `assert-unpublished` fails closed on anything else now. Placed before
      # the gate below so a version already published is caught before
      # spending a `nix flake check` and container build on it.
      - name: Refuse to overwrite a published version
        run: ci/release-hooks.sh assert-unpublished "$GITHUB_REF_NAME"

      # A v* tag can point at any commit, so this can't borrow ci.yml's
      # verdict -- it re-runs the full gate before anything is published.
      - run: nix flake check --print-build-logs

      - run: nix build .#container --print-build-logs

      # The `trap cleanup EXIT` is load-bearing, not tidiness: with no `shell:`
      # key GitHub Actions runs this under `bash -e {0}`, so an unreachable
      # container still aborts the script at the first failing command, and
      # without the trap neither `docker logs` (the only evidence of why
      # nginx died) nor `docker rm -f` would ever run.
      - name: Smoke test the image
        run: |
          docker load < result

          cleanup() {
            docker logs dull-smoke || true
            docker rm -f dull-smoke || true
          }
          trap cleanup EXIT

          docker run -d --name dull-smoke -p 8099:8080 dull.yyc.dev:latest

          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://127.0.0.1:8099/ && break
            sleep 1
          done
          root=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8099/)
          ctype=$(curl -s -o /dev/null -w '%{content_type}' http://127.0.0.1:8099/)
          missing=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8099/definitely-not-here)
          test "$root" = 200 || { echo "FAIL root: $root"; exit 1; }
          test "$ctype" = "text/html" || { echo "FAIL ctype: $ctype"; exit 1; }
          test "$missing" = 404 || { echo "FAIL 404: $missing"; exit 1; }
          echo "smoke test passed"

      - name: Publish the versioned image to ghcr.io
        run: |
          skopeo copy \
            --dest-authfile "$GHCR_AUTHFILE" \
            docker-archive:result \
            "docker://$(ci/release-hooks.sh image):${VERSION}"

      - name: Move :latest to this release
        if: env.IS_STABLE_RELEASE == 'true'
        run: |
          skopeo copy \
            --dest-authfile "$GHCR_AUTHFILE" \
            docker-archive:result \
            "docker://$(ci/release-hooks.sh image):latest"
