daemon off;
worker_processes auto;
# NOTE: logs go to the container's stdout/stderr (access_log below too), not
# files -- nothing else in the image would read or rotate them.
error_log /dev/stderr warn;
# NOTE: /tmp, not the default /run -- the container runs as the unprivileged
# `nobody` user, which cannot write there.
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    # nginx's mime.types has no .webmanifest entry, so it fell to
    # default_type and the application/manifest+json in gzip_types below
    # never matched anything.
    types {
        application/manifest+json  webmanifest;
    }
    default_type  application/octet-stream;
    access_log    /dev/stdout;

    sendfile      on;
    tcp_nopush    on;
    server_tokens off;

    # NOTE: Astro emits no precompressed `.gz` siblings, so `gzip_static`
    # alone matched nothing and the ~194 KB JS bundle was served
    # uncompressed even to clients sending `Accept-Encoding: gzip`.
    # `gzip on` compresses at request time; `gzip_static` stays because it
    # wins whenever a `.gz` sibling does exist and costs nothing when none
    # does, so a build that starts precompressing needs no config change.
    # `text/html` is deliberately absent from `gzip_types` -- nginx always
    # compresses it and listing it is a no-op.
    gzip            on;
    gzip_static     on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_types      application/javascript
                    text/javascript
                    text/css
                    image/svg+xml
                    application/json
                    application/xml
                    application/manifest+json;

    # NOTE: every file in this image carries nix's normalised epoch mtime
    # (`Thu, 01 Jan 1970 00:00:01 GMT`) -- byte-identical in every build --
    # so BOTH of nginx's conditional-request validators are meaningless
    # here. `etag off` alone is not enough: nginx still sends
    # `Last-Modified`, and a client that revalidates with
    # `If-Modified-Since` after a new release gets `304 Not Modified`
    # forever, because the new image's mtime is never newer than the cached
    # one. `if_modified_since off` makes nginx ignore that header and answer
    # `200` with the current bytes. Asset cache correctness comes from
    # Astro's content-hashed `/_astro/` filenames (see the immutable
    # Cache-Control below) instead of from either validator.
    etag off;
    if_modified_since off;

    # SECURITY: the ranges below are RFC1918 private networks -- only a
    # proxy on a private network is trusted to set the client address.
    # Never widen this to 0.0.0.0/0; that lets any client spoof its own
    # address in the logs.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header   X-Forwarded-For;

    server {
        # NOTE: 8080, not 80 -- the container runs as the unprivileged
        # `nobody` user, and binding port 80 would need
        # CAP_NET_BIND_SERVICE. This sits behind a reverse proxy, so the
        # privileged port buys nothing.
        listen      8080;
        root        /var/www/html;
        index       index.html;
        # NOTE: src/pages/ has no 404.astro yet, so this points at a page
        # that doesn't exist. Harmless -- nginx still returns a plain 404 --
        # and left in place so it starts working the moment
        # src/pages/404.astro exists.
        error_page  404 /404.html;

        location /_astro/ {
            # Astro content-hashes these filenames, so a changed file is a
            # new URL -- caching forever is safe. See the `etag off` /
            # `if_modified_since off` note above for why this replaces
            # mtime-based validation rather than complementing it.
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location / {
            # NOTE: resolves Astro's clean URLs -- `/sub` must serve
            # `/sub/index.html`, not just `/sub`.
            try_files $uri $uri/index.html $uri/ =404;
            add_header Cache-Control "public, max-age=300";
        }
    }
}
