daemon off;
worker_processes auto;
# NOTE: logs go to the container's stdout/stderr (access_log below too), not
# files -- nothing else in the image would read or rotate them.
error_log /dev/stderr warn;
# NOTE: /tmp, not the default /run -- the container runs as the unprivileged
# `nobody` user, which cannot write there.
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    /dev/stdout;

    sendfile      on;
    tcp_nopush    on;
    server_tokens off;

    gzip_static   on;

    # NOTE: nix normalises store file mtimes to the epoch, so nginx's
    # default mtime-derived ETag is not a meaningful validator for files
    # baked into this image. Asset cache correctness instead comes from
    # Astro's content-hashed `/_astro/` filenames (see the immutable
    # Cache-Control below), not from a conditional-request validator.
    etag off;

    # SECURITY: the ranges below are RFC1918 private networks -- only a
    # proxy on a private network is trusted to set the client address.
    # Never widen this to 0.0.0.0/0; that lets any client spoof its own
    # address in the logs.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header   X-Forwarded-For;

    server {
        # NOTE: 8080, not 80 -- the container runs as the unprivileged
        # `nobody` user, and binding port 80 would need
        # CAP_NET_BIND_SERVICE. This sits behind a reverse proxy, so the
        # privileged port buys nothing.
        listen      8080;
        root        /var/www/html;
        index       index.html;
        # NOTE: src/pages/ has no 404.astro yet, so this points at a page
        # that doesn't exist. Harmless -- nginx still returns a plain 404 --
        # and left in place so it starts working the moment
        # src/pages/404.astro exists.
        error_page  404 /404.html;

        location /_astro/ {
            # Astro content-hashes these filenames, so a changed file is a
            # new URL -- caching forever is safe. See the `etag off` note
            # above for why this replaces mtime-based validation rather than
            # complementing it.
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location / {
            # NOTE: resolves Astro's clean URLs -- `/sub` must serve
            # `/sub/index.html`, not just `/sub`.
            try_files $uri $uri/index.html $uri/ =404;
            add_header Cache-Control "public, max-age=300";
        }
    }
}
